openapi: 3.1.0
info:
  title: AlumniBridge API
  version: 0.3.1
  description: Identity, onboarding, and owner-only professional profile endpoints. Includes consent-based public profiles, owner privacy controls, and access-controlled photos. Public responses never contain internal identities or private contact data.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Process liveness
      responses:
        '200': {description: API process is running}
  /ready:
    get:
      summary: PostgreSQL readiness
      responses:
        '200': {description: Required database is reachable}
        '503': {description: Required database is unavailable}
  /api/v1/auth/me:
    get:
      summary: Provision and return the authenticated user
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Current user, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/users/me:
    get:
      summary: Return the authenticated user's application account
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Current user, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/auth/onboarding:
    post:
      summary: Create an idempotent student or pending alumni membership
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OnboardingInput'}
      responses:
        '200': {description: Updated current user, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '400': {description: Invalid onboarding input or unknown study program}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Existing membership has different graduation year}
        '415': {description: Content-Type must be application/json}
  /api/v1/users/me/profile:
    get:
      summary: Get or initialize the authenticated member's private profile
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Private profile, content: {application/json: {schema: {$ref: '#/components/schemas/Profile'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    patch:
      summary: Update private profile fields and slug
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProfilePatch'}}}}
      responses:
        '200': {description: Updated profile, content: {application/json: {schema: {$ref: '#/components/schemas/Profile'}}}}
        '400': {description: Invalid input; null is rejected for non-nullable fields}
        '413': {description: JSON body exceeds 64 KiB}
        '415': {description: Content-Type must be application/json}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Slug already reserved}
  /api/v1/users/me/experiences:
    get:
      summary: List the owner's experiences, newest first, at most 100
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Experience list, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Experience'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      summary: Add an experience
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExperienceInput'}}}}
      responses:
        '201': {description: Created experience, content: {application/json: {schema: {$ref: '#/components/schemas/Experience'}}}}
        '400': {description: Invalid input; null is rejected for non-nullable fields}
        '413': {description: JSON body exceeds 64 KiB}
        '415': {description: Content-Type must be application/json}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Experience limit reached}
  /api/v1/users/me/experiences/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    patch:
      summary: Replace the owner's experience fields
      description: All required experience fields must be supplied.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExperienceInput'}}}}
      responses:
        '200': {description: Updated experience, content: {application/json: {schema: {$ref: '#/components/schemas/Experience'}}}}
        '400': {description: Invalid input; null is rejected for non-nullable fields}
        '413': {description: JSON body exceeds 64 KiB}
        '415': {description: Content-Type must be application/json}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Experience absent or not owned}
    delete:
      summary: Delete the owner's experience
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Experience absent or not owned}
  /api/v1/users/me/educations:
    get:
      summary: List the owner's education entries, newest first, at most 100
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Education list, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Education'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      summary: Add education history
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EducationInput'}}}}
      responses:
        '201': {description: Created education entry, content: {application/json: {schema: {$ref: '#/components/schemas/Education'}}}}
        '400': {description: Invalid input; null is rejected for non-nullable fields}
        '413': {description: JSON body exceeds 64 KiB}
        '415': {description: Content-Type must be application/json}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Education limit reached}
  /api/v1/users/me/educations/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    patch:
      summary: Replace the owner's education fields
      description: Institution is required; omitted optional fields are cleared.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EducationInput'}}}}
      responses:
        '200': {description: Updated education entry, content: {application/json: {schema: {$ref: '#/components/schemas/Education'}}}}
        '400': {description: Invalid input; null is rejected for non-nullable fields}
        '413': {description: JSON body exceeds 64 KiB}
        '415': {description: Content-Type must be application/json}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Education entry absent or not owned}
    delete:
      summary: Delete the owner's education entry
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Education entry absent or not owned}
  /api/v1/skills:
    get:
      summary: Search the shared skill vocabulary
      parameters:
        - {name: query, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 80}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        '200': {description: At most 50 prefix matches, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Skill'}}}}}
        '400': {description: Invalid query or limit}
  /api/v1/users/me/skills:
    get:
      summary: List the owner's skills, at most 100
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Skill links, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Skill'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      summary: Add or reuse a normalized skill, idempotent for an existing owner link
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {name: {type: string, minLength: 1, maxLength: 80}}, required: [name]}}}}
      responses:
        '201': {description: Owner skill link, content: {application/json: {schema: {$ref: '#/components/schemas/Skill'}}}}
        '400': {description: Invalid skill name}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Skill limit reached}
  /api/v1/users/me/skills/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    delete:
      summary: Delete the owner's skill link
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Skill link absent or not owned}
  /api/v1/profiles/{slug}:
    parameters: [{name: slug, in: path, required: true, schema: {type: string, minLength: 3, maxLength: 64}}]
    get:
      summary: Read an opted-in public, moderator-visible profile without authentication
      description: Private, hidden, missing and deleted-account slugs return the same 404. All responses use Cache-Control no-store.
      responses:
        '200': {description: Public allowlist DTO, content: {application/json: {schema: {$ref: '#/components/schemas/PublicProfile'}}}}
        '307': {description: Historical slug of the same visible owner, headers: {Location: {schema: {type: string}, description: Current relative profile API URL}}}
        '404': {description: Profile unavailable}
  /api/v1/users/me/profile/privacy:
    get:
      summary: Read the owner's privacy settings, initializing a private profile if absent
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Owner privacy settings, content: {application/json: {schema: {$ref: '#/components/schemas/Privacy'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    patch:
      summary: Explicitly select public or private and optionally update field publication choices
      description: Visibility is mandatory. Omitted flags retain their values. Null, verification and moderation fields are rejected. Publishing shares display name and headline; optional groups remain hidden unless enabled.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Privacy'}}}}
      responses:
        '200': {description: Updated privacy settings, content: {application/json: {schema: {$ref: '#/components/schemas/Privacy'}}}}
        '400': {description: Invalid input}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413': {description: JSON body exceeds 64 KiB}
        '415': {description: Content-Type must be application/json}
  /api/v1/users/me/profile/photo:
    get:
      summary: Read the authenticated owner's photo, including when the profile is private or hidden
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Image bytes; Cache-Control no-store and X-Content-Type-Options nosniff, content: {image/png: {schema: {type: string, format: binary}}, image/jpeg: {schema: {type: string, format: binary}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: No photo}
        '503': {description: Photo storage unavailable}
    post:
      summary: Upload or replace the owner's photo using raw image bytes
      description: At most four uploads buffer/process bodies concurrently per API process; streamed bodies are limited without relying on Content-Length. Maximum 5 MiB input and normalized output; dimensions at most 4096 per side and 8 million pixels. JPEG is re-encoded, PNG and WebP become PNG; metadata is discarded. Filenames and object keys are never accepted. Replaced and abandoned objects are collected by a durable retry worker.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          image/jpeg: {schema: {type: string, format: binary}}
          image/png: {schema: {type: string, format: binary}}
          image/webp: {schema: {type: string, format: binary}}
      responses:
        '201': {description: Photo stored, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {photo_url: {type: string, const: /api/v1/users/me/profile/photo}}, required: [photo_url]}}}}
        '400': {description: Malformed image, MIME/content mismatch, or invalid dimensions}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413': {description: Image exceeds 5 MiB}
        '415': {description: Unsupported image media type}
        '503': {description: Photo storage unavailable}
    delete:
      summary: Remove owner photo metadata immediately and queue object deletion
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Photo absent; deletion retries durably if storage is unavailable}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Profile absent}
  /api/v1/profiles/{slug}/photo:
    parameters: [{name: slug, in: path, required: true, schema: {type: string, minLength: 3, maxLength: 64}}]
    get:
      summary: Read a public photo only if the current profile is public, visible and show_photo is enabled
      description: Visibility is rechecked on every request. Historical slugs resolve through the same owner reservation; tombstones do not resolve. No object storage URL or key is exposed.
      responses:
        '200': {description: Image bytes; Cache-Control no-store and X-Content-Type-Options nosniff, content: {image/png: {schema: {type: string, format: binary}}, image/jpeg: {schema: {type: string, format: binary}}}}
        '404': {description: Photo unavailable}
        '503': {description: Photo storage unavailable}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token with alumnibridge-api audience
  responses:
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Privacy:
      type: object
      additionalProperties: false
      properties:
        visibility: {type: string, enum: [private, public], default: private}
        show_bio: {type: boolean, default: false}
        show_location: {type: boolean, default: false}
        show_current_company: {type: boolean, default: false}
        show_current_job_title: {type: boolean, default: false}
        show_experiences: {type: boolean, default: false}
        show_educations: {type: boolean, default: false}
        show_skills: {type: boolean, default: false}
        show_photo: {type: boolean, default: false}
      required: [visibility]
    PublicProfile:
      type: object
      additionalProperties: false
      properties:
        slug: {type: string}
        display_name: {type: string}
        headline: {type: string}
        verified_alumni: {type: boolean, description: Derived only from trusted verified alumni memberships}
        bio: {type: string}
        location: {type: string}
        current_company: {type: string}
        current_job_title: {type: string}
        experiences: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/PublicExperience'}}
        educations: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/PublicEducation'}}
        skills: {type: array, maxItems: 100, items: {type: string}}
        photo_url: {type: string, description: Relative access-controlled API URL}
      required: [slug, display_name, headline, verified_alumni]
    PublicExperience:
      type: object
      additionalProperties: false
      properties:
        company: {type: string, minLength: 1, maxLength: 160}
        job_title: {type: string, minLength: 1, maxLength: 160}
        employment_type: {type: string, maxLength: 80}
        location: {type: string, maxLength: 120}
        start_date: {type: string, format: date}
        end_date: {type: [string, "null"], format: date}
        is_current: {type: boolean}
        description: {type: string, maxLength: 5000}
      required: [company, job_title, start_date]
    PublicEducation:
      type: object
      additionalProperties: false
      properties:
        institution: {type: string, minLength: 1, maxLength: 200}
        degree: {type: string, maxLength: 160}
        field_of_study: {type: string, maxLength: 160}
        start_date: {type: [string, "null"], format: date}
        end_date: {type: [string, "null"], format: date}
        description: {type: string, maxLength: 5000}
      required: [institution]
    Profile:
      type: object
      additionalProperties: false
      properties:
        display_name: {type: string}
        slug: {type: string}
        headline: {type: string}
        bio: {type: string}
        location: {type: string}
        current_company: {type: string}
        current_job_title: {type: string}
        completeness: {type: integer, minimum: 0, maximum: 100, description: Server-computed private score}
      required: [display_name, slug, headline, bio, location, current_company, current_job_title, completeness]
    ProfilePatch:
      type: object
      additionalProperties: false
      properties:
        display_name: {type: string, minLength: 2, maxLength: 100}
        slug: {type: string, minLength: 3, maxLength: 64}
        headline: {type: string, maxLength: 160}
        bio: {type: string, maxLength: 5000}
        location: {type: string, maxLength: 120}
        current_company: {type: string, maxLength: 160}
        current_job_title: {type: string, maxLength: 160}
    ExperienceInput:
      type: object
      additionalProperties: false
      properties:
        company: {type: string, minLength: 1, maxLength: 160}
        job_title: {type: string, minLength: 1, maxLength: 160}
        employment_type: {type: string, maxLength: 80}
        location: {type: string, maxLength: 120}
        start_date: {type: string, format: date}
        end_date: {type: [string, "null"], format: date}
        is_current: {type: boolean}
        description: {type: string, maxLength: 5000}
      required: [company, job_title, start_date]
    Experience:
      type: object
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        company: {type: string, minLength: 1, maxLength: 160}
        job_title: {type: string, minLength: 1, maxLength: 160}
        employment_type: {type: string, maxLength: 80}
        location: {type: string, maxLength: 120}
        start_date: {type: string, format: date}
        end_date: {type: [string, "null"], format: date}
        is_current: {type: boolean}
        description: {type: string, maxLength: 5000}
      required: [id, company, job_title, start_date]
    EducationInput:
      type: object
      additionalProperties: false
      properties:
        institution: {type: string, minLength: 1, maxLength: 200}
        degree: {type: string, maxLength: 160}
        field_of_study: {type: string, maxLength: 160}
        start_date: {type: [string, "null"], format: date}
        end_date: {type: [string, "null"], format: date}
        description: {type: string, maxLength: 5000}
      required: [institution]
    Education:
      type: object
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        institution: {type: string, minLength: 1, maxLength: 200}
        degree: {type: string, maxLength: 160}
        field_of_study: {type: string, maxLength: 160}
        start_date: {type: [string, "null"], format: date}
        end_date: {type: [string, "null"], format: date}
        description: {type: string, maxLength: 5000}
      required: [id, institution]
    Skill:
      type: object
      additionalProperties: false
      properties:
        id: {type: string, format: uuid, description: Owner link ID for owner routes; vocabulary ID for search}
        name: {type: string}
      required: [id, name]
    Error:
      type: object
      properties:
        error: {type: string}
      required: [error]
    OnboardingInput:
      type: object
      additionalProperties: false
      properties:
        role: {type: string, enum: [student, alumni]}
        display_name: {type: string, minLength: 2, maxLength: 100}
        institution: {type: string, example: uhamka}
        study_program: {type: string, example: mathematics-education}
        graduation_year: {type: integer, minimum: 1950, description: Required for alumni; omitted for students}
      required: [role, display_name, institution, study_program]
    Membership:
      type: object
      properties:
        id: {type: string, format: uuid}
        role: {type: string, enum: [student, alumni]}
        status: {type: string, enum: [active, pending, verified, rejected]}
        institution: {type: string}
        study_program: {type: string}
        graduation_year: {type: integer}
      required: [id, role, status, institution, study_program]
    User:
      type: object
      description: Private current-user response; never a public directory model.
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        display_name: {type: string}
        memberships:
          type: array
          items: {$ref: '#/components/schemas/Membership'}
      required: [id, memberships]
