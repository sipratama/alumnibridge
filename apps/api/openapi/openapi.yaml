openapi: 3.1.0
info:
  title: AlumniBridge API
  version: 0.3.0
  description: Identity, onboarding, and owner-only professional profile endpoints. Public profile reads and photos are deferred.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Process liveness
      responses:
        '200': {description: API process is running}
  /ready:
    get:
      summary: PostgreSQL readiness
      responses:
        '200': {description: Required database is reachable}
        '503': {description: Required database is unavailable}
  /api/v1/auth/me:
    get:
      summary: Provision and return the authenticated user
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Current user, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/users/me:
    get:
      summary: Return the authenticated user's application account
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Current user, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/auth/onboarding:
    post:
      summary: Create an idempotent student or pending alumni membership
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OnboardingInput'}
      responses:
        '200': {description: Updated current user, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '400': {description: Invalid onboarding input or unknown study program}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Existing membership has different graduation year}
        '415': {description: Content-Type must be application/json}
  /api/v1/users/me/profile:
    get:
      summary: Get or initialize the authenticated member's private profile
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Private profile, content: {application/json: {schema: {$ref: '#/components/schemas/Profile'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    patch:
      summary: Update private profile fields and slug
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProfilePatch'}}}}
      responses:
        '200': {description: Updated profile, content: {application/json: {schema: {$ref: '#/components/schemas/Profile'}}}}
        '400': {description: Invalid input; null is rejected for non-nullable fields}
        '413': {description: JSON body exceeds 64 KiB}
        '415': {description: Content-Type must be application/json}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Slug already reserved}
  /api/v1/users/me/experiences:
    get:
      summary: List the owner's experiences, newest first, at most 100
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Experience list, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Experience'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      summary: Add an experience
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExperienceInput'}}}}
      responses:
        '201': {description: Created experience, content: {application/json: {schema: {$ref: '#/components/schemas/Experience'}}}}
        '400': {description: Invalid input; null is rejected for non-nullable fields}
        '413': {description: JSON body exceeds 64 KiB}
        '415': {description: Content-Type must be application/json}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Experience limit reached}
  /api/v1/users/me/experiences/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    patch:
      summary: Replace the owner's experience fields
      description: All required experience fields must be supplied.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExperienceInput'}}}}
      responses:
        '200': {description: Updated experience, content: {application/json: {schema: {$ref: '#/components/schemas/Experience'}}}}
        '400': {description: Invalid input; null is rejected for non-nullable fields}
        '413': {description: JSON body exceeds 64 KiB}
        '415': {description: Content-Type must be application/json}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Experience absent or not owned}
    delete:
      summary: Delete the owner's experience
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Experience absent or not owned}
  /api/v1/users/me/educations:
    get:
      summary: List the owner's education entries, newest first, at most 100
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Education list, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Education'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      summary: Add education history
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EducationInput'}}}}
      responses:
        '201': {description: Created education entry, content: {application/json: {schema: {$ref: '#/components/schemas/Education'}}}}
        '400': {description: Invalid input; null is rejected for non-nullable fields}
        '413': {description: JSON body exceeds 64 KiB}
        '415': {description: Content-Type must be application/json}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Education limit reached}
  /api/v1/users/me/educations/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    patch:
      summary: Replace the owner's education fields
      description: Institution is required; omitted optional fields are cleared.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EducationInput'}}}}
      responses:
        '200': {description: Updated education entry, content: {application/json: {schema: {$ref: '#/components/schemas/Education'}}}}
        '400': {description: Invalid input; null is rejected for non-nullable fields}
        '413': {description: JSON body exceeds 64 KiB}
        '415': {description: Content-Type must be application/json}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Education entry absent or not owned}
    delete:
      summary: Delete the owner's education entry
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Education entry absent or not owned}
  /api/v1/skills:
    get:
      summary: Search the shared skill vocabulary
      parameters:
        - {name: query, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 80}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        '200': {description: At most 50 prefix matches, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Skill'}}}}}
        '400': {description: Invalid query or limit}
  /api/v1/users/me/skills:
    get:
      summary: List the owner's skills, at most 100
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Skill links, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Skill'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      summary: Add or reuse a normalized skill, idempotent for an existing owner link
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {name: {type: string, minLength: 1, maxLength: 80}}, required: [name]}}}}
      responses:
        '201': {description: Owner skill link, content: {application/json: {schema: {$ref: '#/components/schemas/Skill'}}}}
        '400': {description: Invalid skill name}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Skill limit reached}
  /api/v1/users/me/skills/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    delete:
      summary: Delete the owner's skill link
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Skill link absent or not owned}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token with alumnibridge-api audience
  responses:
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Profile:
      type: object
      additionalProperties: false
      properties:
        display_name: {type: string}
        slug: {type: string}
        headline: {type: string}
        bio: {type: string}
        location: {type: string}
        current_company: {type: string}
        current_job_title: {type: string}
        completeness: {type: integer, minimum: 0, maximum: 100, description: Server-computed private score}
      required: [display_name, slug, headline, bio, location, current_company, current_job_title, completeness]
    ProfilePatch:
      type: object
      additionalProperties: false
      properties:
        display_name: {type: string, minLength: 2, maxLength: 100}
        slug: {type: string, minLength: 3, maxLength: 64}
        headline: {type: string, maxLength: 160}
        bio: {type: string, maxLength: 5000}
        location: {type: string, maxLength: 120}
        current_company: {type: string, maxLength: 160}
        current_job_title: {type: string, maxLength: 160}
    ExperienceInput:
      type: object
      additionalProperties: false
      properties:
        company: {type: string, minLength: 1, maxLength: 160}
        job_title: {type: string, minLength: 1, maxLength: 160}
        employment_type: {type: string, maxLength: 80}
        location: {type: string, maxLength: 120}
        start_date: {type: string, format: date}
        end_date: {type: [string, "null"], format: date}
        is_current: {type: boolean}
        description: {type: string, maxLength: 5000}
      required: [company, job_title, start_date]
    Experience:
      type: object
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        company: {type: string, minLength: 1, maxLength: 160}
        job_title: {type: string, minLength: 1, maxLength: 160}
        employment_type: {type: string, maxLength: 80}
        location: {type: string, maxLength: 120}
        start_date: {type: string, format: date}
        end_date: {type: [string, "null"], format: date}
        is_current: {type: boolean}
        description: {type: string, maxLength: 5000}
      required: [id, company, job_title, start_date]
    EducationInput:
      type: object
      additionalProperties: false
      properties:
        institution: {type: string, minLength: 1, maxLength: 200}
        degree: {type: string, maxLength: 160}
        field_of_study: {type: string, maxLength: 160}
        start_date: {type: [string, "null"], format: date}
        end_date: {type: [string, "null"], format: date}
        description: {type: string, maxLength: 5000}
      required: [institution]
    Education:
      type: object
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        institution: {type: string, minLength: 1, maxLength: 200}
        degree: {type: string, maxLength: 160}
        field_of_study: {type: string, maxLength: 160}
        start_date: {type: [string, "null"], format: date}
        end_date: {type: [string, "null"], format: date}
        description: {type: string, maxLength: 5000}
      required: [id, institution]
    Skill:
      type: object
      additionalProperties: false
      properties:
        id: {type: string, format: uuid, description: Owner link ID for owner routes; vocabulary ID for search}
        name: {type: string}
      required: [id, name]
    Error:
      type: object
      properties:
        error: {type: string}
      required: [error]
    OnboardingInput:
      type: object
      additionalProperties: false
      properties:
        role: {type: string, enum: [student, alumni]}
        display_name: {type: string, minLength: 2, maxLength: 100}
        institution: {type: string, example: uhamka}
        study_program: {type: string, example: mathematics-education}
        graduation_year: {type: integer, minimum: 1950, description: Required for alumni; omitted for students}
      required: [role, display_name, institution, study_program]
    Membership:
      type: object
      properties:
        id: {type: string, format: uuid}
        role: {type: string, enum: [student, alumni]}
        status: {type: string, enum: [active, pending, verified, rejected]}
        institution: {type: string}
        study_program: {type: string}
        graduation_year: {type: integer}
      required: [id, role, status, institution, study_program]
    User:
      type: object
      description: Private current-user response; never a public directory model.
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        display_name: {type: string}
        memberships:
          type: array
          items: {$ref: '#/components/schemas/Membership'}
      required: [id, memberships]
