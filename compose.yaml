services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-alumnibridge}:${POSTGRES_PASSWORD:-local_dev_only_change_me}@postgres:5432/${POSTGRES_DB:-alumnibridge}?sslmode=disable
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-18085}/realms/alumnibridge
      OIDC_JWKS_URL: http://keycloak:8080/realms/alumnibridge/protocol/openid-connect/certs
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-alumnibridge-api}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-alumnibridge-web}
      OBJECT_STORAGE_ENDPOINT: minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-alumnibridge_dev_only}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-local_minio_only_change_me}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-alumnibridge-profile-photos}
      OBJECT_STORAGE_SECURE: "false"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["/app/migrate", "-path", "/app/migrations", "up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-alumnibridge}:${POSTGRES_PASSWORD:-local_dev_only_change_me}@postgres:5432/${POSTGRES_DB:-alumnibridge}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  web:
    build:
      context: apps/web
      args:
        VITE_KEYCLOAK_URL: http://localhost:${KEYCLOAK_PORT:-18085}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-alumnibridge}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-alumnibridge-web}
        VITE_OIDC_CALLBACK_URI: ${VITE_OIDC_CALLBACK_URI:-http://localhost:5173/}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api
    restart: unless-stopped
  minio:
    build:
      context: infrastructure/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-alumnibridge_dev_only}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local_minio_only_change_me}
    ports:
      - "127.0.0.1:${MINIO_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alumnibridge}
      POSTGRES_USER: ${POSTGRES_USER:-alumnibridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  keycloak-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-local_keycloak_db_only}
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-local_keycloak_db_only}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-localadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local_admin_only}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-18085}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-18085}:8080"
    volumes:
      - ./infrastructure/keycloak/alumnibridge-realm.json:/opt/keycloak/data/import/alumnibridge-realm.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
  keycloak_data:
  minio_data:
