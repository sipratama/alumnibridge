name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend / test, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend / test, race, vet, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: go mod download
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/api

  integration:
    name: Integration / PostgreSQL, MinIO, migrations
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alumnibridge
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: alumnibridge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alumnibridge -d alumnibridge_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      # Isolated CI fixture only; never use this cursor key in a shared deployment.
      DIRECTORY_CURSOR_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DATABASE_URL: postgres://alumnibridge:ci_test_only@127.0.0.1:5432/alumnibridge_ci?sslmode=disable
      TEST_DATABASE_URL: postgres://alumnibridge:ci_test_only@127.0.0.1:5432/alumnibridge_ci?sslmode=disable
      TEST_OBJECT_STORAGE_ENDPOINT: 127.0.0.1:19000
      TEST_OBJECT_STORAGE_ACCESS_KEY: alumnibridge_ci
      TEST_OBJECT_STORAGE_SECRET_KEY: ci_testing_only_password
      PGPASSWORD: ci_test_only
      PGUSER: alumnibridge
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: alumnibridge_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Build dedicated development-only MinIO image
        run: docker build -t alumnibridge-ci-minio infrastructure/minio

      - name: Start and verify private object storage
        run: |
          docker run -d --name alumnibridge-ci-minio \
            -p 127.0.0.1:19000:9000 \
            -e MINIO_ROOT_USER="$TEST_OBJECT_STORAGE_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$TEST_OBJECT_STORAGE_SECRET_KEY" \
            alumnibridge-ci-minio
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:19000/minio/health/ready > /dev/null; then
              echo "Object storage ready"
              exit 0
            fi
            sleep 2
          done
          docker logs alumnibridge-ci-minio
          exit 1

      - name: Migration apply, rollback, reapply (isolated CI database)
        run: |
          set -euo pipefail
          shopt -s nullglob
          up_files=(infrastructure/migrations/*.up.sql)
          down_files=(infrastructure/migrations/*.down.sql)
          test ${#up_files[@]} -gt 0
          for file in "${up_files[@]}"; do
            psql -v ON_ERROR_STOP=1 -f "$file"
          done
          for ((i=${#down_files[@]}-1; i>=0; i--)); do
            psql -v ON_ERROR_STOP=1 -f "${down_files[$i]}"
          done
          for file in "${up_files[@]}"; do
            psql -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: PostgreSQL + MinIO integration tests
        working-directory: apps/api
        run: go test -count=1 ./...

      - name: Integration diagnostics on failure
        if: failure()
        run: |
          docker logs --tail 100 alumnibridge-ci-minio 2>/dev/null || true
          psql -c 'SELECT version, dirty FROM schema_migrations;' || true

  repository:
    name: Repository / whitespace
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: git diff --check HEAD^ HEAD
